<mat-toolbar class="toolbar">
  <img class="logo" src="logo.svg" alt="" />
  <span class="brand">
    <span class="app-name">Med<b>Tech</b></span>
    <span class="app-sub">EHPAD</span>
  </span>

  <span class="spacer"></span>

  @if (user(); as currentUser) {
    <span class="user">
      <span class="user-name">{{ currentUser.fullName }}</span>
      <span class="user-role">{{ roleLabel() }}</span>
    </span>
  }

  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="dark() ? 'Passer en mode clair' : 'Passer en mode sombre'"
    [attr.aria-pressed]="dark()"
    (click)="toggleTheme()"
  >
    <mat-icon fontSet="material-symbols-outlined">{{ dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button type="button" aria-label="Déconnexion" title="Déconnexion" (click)="logout()">
    <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
  </button>
</mat-toolbar>
