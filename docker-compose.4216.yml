name: medtech-demo-4216
services:
  db:
    volumes:
      - ./demo4216/initdb:/docker-entrypoint-initdb.d:ro
      - medtech_personnel_v2:/var/lib/postgresql/data

  backend:
    ports: !reset []
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:4216},capacitor://localhost"

  db-demo-4216:
    image: postgres:17
    environment:
      PGPASSWORD: change_me
      PGTZ: Europe/Paris
    volumes:
      - ./database:/sql:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "medtech", "-v", "ON_ERROR_STOP=1", "-f", "/sql/seed_demo_4216.sql"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  frontend-4216:
    build:
      context: .
      dockerfile: demo4216/Dockerfile
    depends_on:
      backend:
        condition: service_started
      db-demo-4216:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MEDTECH_DEMO_PORT:-4216}:80"

volumes:
  medtech_personnel_v2:
