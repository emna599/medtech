# =============================================================================
#  MedTech EHPAD — lancement complet en une seule commande :
#      docker compose up --build
#  Puis ouvrir http://localhost:4200  (API sur http://localhost:8080)
#  Comptes de démo : admin / personnel / medecin — mot de passe : Demo1234!
# =============================================================================
services:
  # ---------- Base de données PostgreSQL (schéma + jeux de démo auto-chargés) ----------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: medtech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    volumes:
      - ./database:/sql:ro
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - medtech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medtech"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Backend Spring Boot ----------
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/medtech
      DB_USERNAME: postgres
      DB_PASSWORD: change_me
      JWT_SECRET: dev_secret_key_please_change_me_32_chars_min_000
      JWT_EXPIRATION_MINUTES: "60"
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: on-failure

  # ---------- Frontend Angular (servi par nginx) ----------
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  medtech_pgdata:
