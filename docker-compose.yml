# =============================================================================
#  MedTech EHPAD — lancement complet en une seule commande :
#      docker compose up --build
#  Puis ouvrir http://localhost:4200  (API sur http://localhost:8080)
#  Comptes de démo : admin / personnel / medecin — mot de passe : Demo1234!
# =============================================================================
services:
  # ---------- Base de données PostgreSQL (schéma + jeux de démo auto-chargés) ----------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: medtech
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: change_me
    volumes:
      - ./database:/sql:ro
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - medtech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medtech"]
      interval: 5s
      timeout: 3s
      retries: 20

  db-migrate:
    image: postgres:17
    environment:
      PGPASSWORD: change_me
    volumes:
      - ./database:/sql:ro
    command: ["psql", "-h", "db", "-U", "postgres", "-d", "medtech", "-v", "ON_ERROR_STOP=1", "-f", "/sql/security_and_concurrency.sql", "-f", "/sql/handover.sql", "-f", "/sql/resident_daily.sql", "-f", "/sql/handover_assignment.sql", "-f", "/sql/medical_record_version.sql", "-f", "/sql/personnel_service.sql"]
    depends_on:
      db:
        condition: service_healthy

  # ---------- Backend Spring Boot ----------
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/medtech
      DB_USERNAME: postgres
      DB_PASSWORD: change_me
      JWT_SECRET: dev_secret_key_please_change_me_32_chars_min_000
      JWT_EXPIRATION_MINUTES: "30"
      SERVER_ADDRESS: 0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    restart: on-failure

  # ---------- Frontend Angular (servi par nginx) ----------
  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:4200:80"

volumes:
  medtech_pgdata:
