<mat-toolbar class="toolbar">
  <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">medical_services</mat-icon>
  <span class="app-name">MedTech EHPAD</span>

  <span class="spacer"></span>

  @if (user(); as currentUser) {
    <span class="user">
      <span class="user-name">{{ currentUser.fullName }}</span>
      <span class="user-role">{{ roleLabel() }}</span>
    </span>
  }

  <button mat-button type="button" (click)="logout()">
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">logout</mat-icon>
    Déconnexion
  </button>
</mat-toolbar>
