<header class="toolbar">
  <a class="identity" [routerLink]="homeRoute()" aria-label="MedTech EHPAD, accueil de votre espace">
    <img class="logo" src="logo.svg" alt="" />
    <span class="brand">
      <span class="app-name">Med<b>Tech</b></span>
      <span class="app-sub">EHPAD</span>
    </span>
  </a>

  <span class="spacer"></span>

  @if (user(); as currentUser) {
    <span class="user">
      <span class="user-name">{{ currentUser.fullName }}</span>
      <span class="user-role">{{ roleLabel() }}</span>
    </span>
  }

  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="dark() ? 'Passer en mode clair' : 'Passer en mode sombre'"
    [attr.aria-pressed]="dark()"
    (click)="toggleTheme()"
  >
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">{{ dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-stroked-button type="button" class="logout" aria-label="Déconnexion" (click)="logout()">
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">logout</mat-icon>
    <span class="logout-label">Déconnexion</span>
  </button>
</header>
