<mat-toolbar class="toolbar">
  <img class="logo" src="logo.svg" alt="" />
  <span class="brand">
    <span class="app-name">Med<b>Tech</b></span>
    <span class="app-sub">EHPAD</span>
  </span>

  <span class="spacer"></span>

  @if (user(); as currentUser) {
    <span class="user">
      <span class="user-name">{{ currentUser.fullName }}</span>
      <span class="user-role">{{ roleLabel() }}</span>
    </span>
  }

  <button mat-stroked-button type="button" class="projection-toggle"
    [attr.aria-pressed]="projection()" aria-label="Mode projection"
    (click)="toggleProjection()">
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">present_to_all</mat-icon>
    Projection
  </button>

  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="dark() ? 'Passer en mode clair' : 'Passer en mode sombre'"
    [attr.aria-pressed]="dark()"
    (click)="toggleTheme()"
  >
    <mat-icon fontSet="material-symbols-outlined">{{ dark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-button type="button" class="logout" aria-label="Déconnexion" (click)="logout()">
    <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">logout</mat-icon>
    <span class="logout-label">Déconnexion</span>
  </button>
</mat-toolbar>
