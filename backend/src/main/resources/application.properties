spring.application.name=ehpad-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=none
server.error.include-stacktrace=never

# Charge automatiquement le fichier .env de la racine du projet (jamais commité).
# Fonctionne si l'application est lancée depuis backend/ ou depuis la racine du dépôt.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Base de données
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate : vérifie seulement que les entités correspondent au schéma
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT (le secret doit faire au moins 32 caractères) et CORS (frontend Angular)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Lecture des pochettes par OCR (service Flask de l'équipe, facultatif) et taille maximale des photos
ocr.service.url=${OCR_SERVICE_URL:http://localhost:5000}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
