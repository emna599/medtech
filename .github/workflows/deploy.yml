name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, medtech-pct]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: mvn -B -DskipTests clean package
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          npm ci
          npx ng build
        working-directory: frontend

      - name: Deploy frontend
        run: |
          rm -rf /opt/medtech/web/*
          cp -r frontend/dist/frontend/browser/. /opt/medtech/web/

      - name: Deploy
        run: |
          install -m 0644 backend/target/*.jar /opt/medtech/app.jar.new
          sudo install -m 0644 /opt/medtech/app.jar.new /opt/medtech/app.jar
          rm -f /opt/medtech/app.jar.new
          sudo systemctl restart medtech
